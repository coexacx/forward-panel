[package]
name = "vistart-forward"
version = "0.3.8"
edition = "2024"
license = "MIT"

[features]
default = ["controller"]
controller = ["dep:sqlx","dep:axum","dep:russh","dep:reqwest","dep:spki","dep:pkcs1","dep:md-5","dep:base64","dep:ed25519-dalek","dep:ring","dep:argon2","dep:bcrypt","dep:aes-gcm","dep:hmac","dep:sha1","dep:data-encoding","dep:lettre","dep:hyper","dep:hyper-util","dep:tower"]
[[bin]]
name = "vistart-controller"
path = "src/bin/controller.rs"
required-features = ["controller"]
[[bin]]
name = "vistart-agent"
path = "src/bin/agent.rs"

[dependencies]
anyhow = "1"
serde = {version="1",features=["derive"]}
serde_json = "1"
tokio = {version="1",features=["full"]}
tokio-util = {version="0.7",features=["rt"]}
futures-util = "0.3"
tokio-tungstenite = {version="0.29",features=["rustls-tls-native-roots"]}
rustls = {version="0.23",default-features=false,features=["std","ring","tls12"]}
sha2 = {version="0.10",features=["oid"]}
hex = "0.4"
rand = "0.8"
subtle = "2"
url = "2"
ipnet = "2"
socket2 = {version="0.6",features=["all"]}
libc = "0.2"
fs2 = "0.4"
regex = "1"
arc-swap = "1"
sqlx = {version="0.8.6",default-features=false,features=["runtime-tokio-rustls","mysql"],optional=true}
axum = {version="0.8",features=["ws"],optional=true}
russh = {version="0.63.3",default-features=false,features=["ring","rsa"],optional=true}
reqwest = {version="0.12",default-features=false,features=["rustls-tls","json","stream"],optional=true}
ring = {version="0.17",optional=true}
spki = {version="0.7",optional=true}
pkcs1 = {version="0.7",optional=true}
md-5 = {version="0.10",optional=true}
base64 = {version="0.22",optional=true}
ed25519-dalek = {version="2",optional=true}

argon2 = {version="0.5",optional=true}
bcrypt = {version="0.19",optional=true}
aes-gcm = {version="0.10",optional=true}
hmac = {version="0.12",optional=true}
sha1 = {version="0.10",optional=true}
data-encoding = {version="2",optional=true}
lettre = {version="0.11",default-features=false,features=["builder","smtp-transport","tokio1-rustls-tls","ring","webpki-roots"],optional=true}

hyper = {version="1",features=["server","http1"],optional=true}
hyper-util = {version="0.1",features=["tokio"],optional=true}
tower = {version="0.5",features=["util"],optional=true}

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
